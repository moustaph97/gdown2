[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gdown2"
version = "0.2.1"
description = "Fast, resumable Google Drive file and folder downloader with async I/O, Rich CLI, and Textual TUI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "gdown2 contributors" }
]
keywords = ["google-drive", "downloader", "cli", "tui", "async", "gdown"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.70.0",
    "beautifulsoup4>=4.12.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
service-account = [
    "google-auth>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "google-auth>=2.0.0",
]

[project.scripts]
gdown2 = "gdown2.interfaces.cli.app:main"

[project.urls]
Homepage = "https://github.com/moustaph97/gdown2"
Repository = "https://github.com/moustaph97/gdown2"
Issues = "https://github.com/moustaph97/gdown2/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gdown2*"]

[tool.setuptools.package-data]
gdown2 = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
